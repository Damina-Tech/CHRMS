name: Inspect CHRMS VPS
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, reclaim-cache, reclaim-all-cache]
        default: inspect
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          OPERATION: ${{ inputs.operation }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: OPERATION
          script: |
            set -eu
            df -h /var/lib/docker
            df -i /var/lib/docker
            docker system df
            df -h / /tmp /var
            vgs || true
            du -x -h --max-depth=1 /var 2>/dev/null || true
            if [ "$OPERATION" = reclaim-cache ] || [ "$OPERATION" = reclaim-all-cache ]; then
              if pgrep -f '^docker compose' >/dev/null; then
                echo 'Compose is active; refusing cache cleanup during a build.'
                exit 1
              fi
              if [ "$OPERATION" = reclaim-all-cache ]; then
                docker builder prune -af
              else
                docker builder prune -af --filter until=24h
              fi
              docker image prune -f
              apt-get clean
              df -h /var/lib/docker
              docker system df
              exit 0
            fi
            for path in /var/www/CHRMS /var/www/CHRMS/CHRMS; do
              if [ -d "$path/.git" ]; then
                echo "CHRMS clone: $path"
                git -C "$path" remote -v
                git -C "$path" status --short
                if [ -f "$path/.env" ]; then echo 'Root production .env exists'; fi
              fi
            done
            docker ps --format '{{.Names}} {{.Image}} {{.Ports}}'
            docker inspect --format '{{.Name}} networks={{json .NetworkSettings.Networks}}' hrms-proxy-1
            if docker inspect chrms-chrms-api-1 >/dev/null 2>&1; then
              cd /var/www/CHRMS
              export ADMIN_EMAIL="$(sed -n 's/^ADMIN_EMAIL=//p' .env | tr -d '\r')"
              export ADMIN_PASSWORD="$(sed -n 's/^ADMIN_PASSWORD=//p' .env | tr -d '\r')"
              docker exec -i -e ADMIN_EMAIL -e ADMIN_PASSWORD chrms-chrms-api-1 node <<'NODE'
            (async () => {
              const response = await fetch('http://127.0.0.1:3000/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }),
              });
              if (!response.ok) throw new Error('Administrator login failed: HTTP ' + response.status);
              const data = await response.json();
              const me = await fetch('http://127.0.0.1:3000/users/me', {
                headers: { Authorization: 'Bearer ' + data.access_token },
              });
              if (!me.ok) throw new Error('Authenticated profile failed: HTTP ' + me.status);
              console.log('Administrator login and authenticated profile passed.');
            })().catch(error => { console.error(error.message); process.exitCode = 1; });
            NODE
              unset ADMIN_EMAIL ADMIN_PASSWORD
            fi
