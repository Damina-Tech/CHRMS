name: Deploy CHRMS to VPS
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'deploy/**', '*compose*.yml', '.env.example', '.github/workflows/deploy-vps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chrms-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify containers, migrations and health
        env:
          DEPLOY_DOMAINS: '0'
        run: bash deploy/deploy.sh
      - name: Clean up CI database
        if: always()
        run: docker compose down -v
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/CHRMS' }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: APP_DIR,DEPLOY_SHA
          command_timeout: 40m
          script: |
            set -eu
            cd "$APP_DIR"
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
            git checkout --detach "$DEPLOY_SHA"
            bash deploy/deploy.sh
