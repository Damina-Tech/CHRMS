name: Configure CHRMS proxy domains
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chrms-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/CHRMS' }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,DEPLOY_SHA
          script: |
            set -eu
            cd "$APP_DIR"
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
            git checkout --detach "$DEPLOY_SHA"
            bash deploy/configure-domains.sh
